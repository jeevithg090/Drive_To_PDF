<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Google Drive PDF Downloader</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --brand: #9333ea;
        --brand-hover: #7e22ce;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --border: #1e293b;
          --text: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }
      .code {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--brand);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 0.5rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--brand-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This page doesn’t exist. The converter lives on the home page.</p>
      <a href="/">Go to the converter</a>
    </main>
  </body>
</html>
